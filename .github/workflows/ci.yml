name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repo and uploads an artifact.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a busy PR doesn't burn 3-OS matrix minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure python3 is available (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $py = (Get-Command python).Source
            Copy-Item $py (Join-Path (Split-Path $py) "python3.exe")
          }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run compile
      - run: npm test

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx --yes @vscode/vsce package --no-dependencies -o claudegate.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: claudegate-vsix
          path: claudegate.vsix
